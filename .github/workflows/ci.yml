name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Sysacta.sln
      - name: Build
        run: dotnet build Sysacta.sln -c Release --no-restore
      # Hardware tests that change device state are opt-in (SYSACTA_HARDWARE_TESTS) and never run in CI.
      # Tests needing an audio device skip themselves on runners without one.
      - name: Test
        run: dotnet test Sysacta.sln -c Release --no-build --logger "trx" --results-directory TestResults
      # Launches the real exe (tray only): DB migration, MCP server on 127.0.0.1:8765, 401 without token, single instance.
      - name: Smoke test the application
        shell: pwsh
        run: ./scripts/smoke-app.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
