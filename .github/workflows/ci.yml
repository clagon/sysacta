name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      # Actions are pinned to commit SHAs (the tag each one resolved to when pinned).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Sysacta.sln
      - name: Build
        run: dotnet build Sysacta.sln -c Release --no-restore
      # Hardware tests that change device state are opt-in (SYSACTA_HARDWARE_TESTS) and never run in CI.
      # Tests needing an audio device skip themselves on runners without one.
      - name: Test
        run: dotnet test Sysacta.sln -c Release --no-build --logger "trx" --results-directory TestResults
        env:
          # App.Tests renders every page to PNG for layout review (uploaded with the test results).
          SYSACTA_SCREENSHOT_DIR: ${{ github.workspace }}/TestResults/screenshots
      # Launches the real exe: server start, 401, close-to-tray, single instance, and a TypeScript SDK MCP client.
      - name: Smoke test the application
        shell: pwsh
        run: ./scripts/smoke-app.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults
